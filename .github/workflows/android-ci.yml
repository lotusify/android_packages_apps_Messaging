name: Build LineageOS Messaging

on:
  workflow_dispatch:
  push:
    branches:
      - 'lineage-21.0'
  pull_request:
    branches:
      - 'lineage-21.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository's source code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Install all the necessary dependencies for the build environment
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libwxgtk3.0-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      # Step 3: Install the 'repo' tool, which is used for syncing the Android source
      - name: Setup 'repo' tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Step 4: Initialize and sync the LineageOS 21 (Android 14) source tree
      - name: Initialize and Sync LineageOS Source
        run: |
          mkdir ~/lineage
          cd ~/lineage
          export PATH=~/bin:$PATH
          # Using the same branch name as your repository for consistency
          repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc --all) --force-sync

      # Step 5: Copy your Messaging app source into the LineageOS source tree
      - name: Copy app source into tree
        run: |
          cd ~/lineage
          # Remove the default Messaging directory and replace it with your source code
          rm -rf packages/apps/Messaging
          rsync -a $GITHUB_WORKSPACE/ packages/apps/Messaging/

      # Step 6: Build the Messaging App module
      - name: Build the Messaging App
        run: |
          cd ~/lineage
          source build/envsetup.sh
          # Use a suitable build target for LineageOS 21
          breakfast lineage_sdk_phone_arm64
          m messaging