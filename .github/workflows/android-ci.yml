name: Android CI (Soong)

on:
  push:
    branches: [ "lineage-22.2" ]
  pull_request:
    branches: [ "lineage-22.2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache \
          libgl1-mesa-dev libxml2-utils xsltproc unzip bc python3

    - name: Clone Android build system (minimal)
      run: |
        git clone https://android.googlesource.com/platform/build.git build
        git clone https://android.googlesource.com/platform/build/soong.git build/soong
        git clone https://android.googlesource.com/platform/build/blueprint.git build/blueprint

    - name: Build APK for messaging app
      run: |
        export PATH=$PWD/build/soong/scripts:$PATH
        cd $GITHUB_WORKSPACE
        build/soong/soong_ui.bash --make-mode messaging

    - name: Find and upload APK
      run: |
        find out/ -iname "messaging.apk" > apk_paths.txt
        cat apk_paths.txt
      shell: bash

    - name: Upload APK artifact
      uses: actions/upload-artifact@v2
      with:
        name: messaging-apk
        path: |
          $(cat apk_paths.txt)
